name: Go

on:
  push:
  pull_request:

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go 1.13
        uses: actions/setup-go@v6
        with:
          go-version: '1.13.15'
          cache: false

      - name: Display Go version
        run: go version

      - name: Build & Test
        run: make ci